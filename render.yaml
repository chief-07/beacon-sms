services:
  - type: web
    name: beacon-sms-gateway
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: HTTPSMS_API_KEY
        sync: false
      - key: GATEWAY_PHONE_NUMBER
        sync: false
      - key: MAX_SMS_CHARACTERS
        value: "280"
